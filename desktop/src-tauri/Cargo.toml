[package]
name = "raffronto"
version = "0.1.0"
description = "Raffronto: confronta due versioni di un documento Word o PDF"
edition = "2021"

[lib]
name = "raffronto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-window-state = "2"
